name: Ingest mensual (4 plataformas con caps)

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Mes a ingestar (formato YYYY-MM, ej: 2026-07)"
        required: true
        default: "2026-07"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APIFY_TOKEN:           ${{ secrets.APIFY_TOKEN }}
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run full ingester (IG, FB, TT, LI)
        run: python scripts/ingest_monthly.py --period "${{ github.event.inputs.period }}"

      - name: Commit thumbnails al repo (persistir imágenes descargadas)
        run: |
          git config user.email "bot@datalitica.com.co"
          git config user.name "Datalitica Bot"
          git add assets/thumbs/ || true
          git diff --quiet --cached && echo "Sin thumbs nuevos" && exit 0
          git commit -m "Ingest ${{ github.event.inputs.period }}: thumbnails persistidos"
          git pull --rebase origin main || true
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || true
            sleep 2
          done

      - name: Resumen
        if: always()
        run: |
          echo "### Ingest ${{ github.event.inputs.period }}" >> $GITHUB_STEP_SUMMARY
          echo "- Posts + accounts + aggregates en Supabase" >> $GITHUB_STEP_SUMMARY
          echo "- Thumbnails locales commiteados al repo" >> $GITHUB_STEP_SUMMARY
          echo "- Siguiente: disparar build_diagnostico_extendido con period=all" >> $GITHUB_STEP_SUMMARY
