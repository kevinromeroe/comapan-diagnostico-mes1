name: Ingest mensual (4 plataformas con caps)

on:
  schedule:
    - cron: "0 12 * * 1"   # Lunes 07:00 Bogota (12:00 UTC) — ingest automático del mes en curso
  workflow_dispatch:
    inputs:
      period:
        description: "Mes a ingestar (YYYY-MM). Vacío = mes actual detectado automáticamente"
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APIFY_TOKEN:           ${{ secrets.APIFY_TOKEN }}
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Determinar periodo (input o mes actual Bogota)
        id: p
        run: |
          IN="${{ github.event.inputs.period }}"
          if [ -z "$IN" ]; then
            # Cron o dispatch sin input → mes actual en Bogota (UTC-5)
            IN=$(TZ='America/Bogota' date +%Y-%m)
          fi
          echo "period=$IN" >> "$GITHUB_OUTPUT"
          echo "→ Ingest para $IN"

      - name: Run full ingester (IG, FB, TT, LI)
        run: python scripts/ingest_monthly.py --period "${{ steps.p.outputs.period }}"

      - name: Commit thumbnails al repo (persistir imágenes descargadas)
        run: |
          git config user.email "bot@datalitica.com.co"
          git config user.name "Datalitica Bot"
          git add assets/thumbs/ || true
          git diff --quiet --cached && echo "Sin thumbs nuevos" && exit 0
          git commit -m "Ingest ${{ github.event.inputs.period }}: thumbnails persistidos"
          git pull --rebase origin main || true
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || true
            sleep 2
          done

      - name: Trigger build automatico
        if: success()
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: build_diagnostico_extendido.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: '{"period":"all"}'

      - name: Resumen
        if: always()
        run: |
          echo "### Ingest ${{ steps.p.outputs.period }}" >> $GITHUB_STEP_SUMMARY
          echo "- Posts + accounts + aggregates en Supabase" >> $GITHUB_STEP_SUMMARY
          echo "- Thumbnails locales commiteados" >> $GITHUB_STEP_SUMMARY
          echo "- Build encadenado automaticamente" >> $GITHUB_STEP_SUMMARY
