name: Rescate TT Julio 2026 (thumbnails)

on:
  workflow_dispatch:
    inputs:
      apify_run_id:
        description: 'Apify run ID de tiktok-profile-scraper (default: hvWClZdWc9UleEN0L)'
        required: false
        default: 'hvWClZdWc9UleEN0L'

jobs:
  rescate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Descargar thumbnails y actualizar Supabase
        env:
          APIFY_TOKEN:            ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          APIFY_RUN_ID:           ${{ github.event.inputs.apify_run_id }}
        run: |
          python <<'PY'
          import json, os, sys, urllib.request, urllib.error
          from pathlib import Path

          APIFY_TOKEN  = os.environ["APIFY_TOKEN"]
          SUPABASE_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SERVICE_KEY  = os.environ["SUPABASE_SERVICE_KEY"]
          RUN_ID       = os.environ["APIFY_RUN_ID"]

          TARGET_IDS = {
              "7662869627386580225",
              "7662496059524009233",
              "7660926263128755473",
          }
          THUMBS_DIR = Path("assets/thumbs")
          THUMBS_DIR.mkdir(parents=True, exist_ok=True)

          # 1) Leer dataset del run (endpoint oficial Apify v2)
          url = f"https://api.apify.com/v2/actor-runs/{RUN_ID}/dataset/items?token={APIFY_TOKEN}&clean=true&format=json"
          req = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=60) as r:
              items = json.loads(r.read().decode("utf-8"))
          print(f"[INFO] {len(items)} items en el dataset")

          done = 0
          for item in items:
              pid = str(item.get("id") or "")
              if not pid:
                  wvu = item.get("webVideoUrl") or ""
                  pid = wvu.rstrip("/").split("/")[-1] if wvu else ""
              if pid not in TARGET_IDS:
                  continue

              vm = item.get("videoMeta") or {}
              cover = vm.get("coverUrl") or vm.get("originalCoverUrl")
              if not cover:
                  print(f"[WARN] {pid} sin coverUrl")
                  continue

              # 2) Descargar cover
              dst = THUMBS_DIR / f"tt_{pid}.jpg"
              try:
                  ireq = urllib.request.Request(cover, headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "image/jpeg,image/*",
                  })
                  with urllib.request.urlopen(ireq, timeout=30) as ir:
                      dst.write_bytes(ir.read())
                  print(f"[OK] {pid} → {dst} ({dst.stat().st_size} bytes)")
              except Exception as e:
                  print(f"[FAIL] {pid} cover download: {e}")
                  continue

              # 3) UPDATE posts.thumb_local
              patch_url = f"{SUPABASE_URL}/rest/v1/posts?id=eq.{pid}"
              body = json.dumps({"thumb_local": str(dst)}).encode("utf-8")
              preq = urllib.request.Request(patch_url, data=body, method="PATCH", headers={
                  "apikey": SERVICE_KEY,
                  "Authorization": f"Bearer {SERVICE_KEY}",
                  "Content-Type": "application/json",
                  "Prefer": "return=minimal",
              })
              try:
                  with urllib.request.urlopen(preq, timeout=30):
                      pass
                  print(f"[OK] Supabase posts.thumb_local({pid}) = {dst}")
                  done += 1
              except urllib.error.HTTPError as he:
                  print(f"[FAIL] Supabase PATCH {pid}: HTTP {he.code} · {he.read().decode('utf-8', 'replace')[:200]}")

          if done == 0:
              print("[FATAL] no se descargó ningún thumbnail. Ver logs arriba.")
              sys.exit(1)
          print(f"\n[DONE] {done}/3 thumbnails rescatados y persistidos.")
          PY

      - name: Commit thumbnails al repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/thumbs/tt_*.jpg
          if git diff --staged --quiet; then
            echo "Sin cambios de imágenes"
          else
            git commit -m "chore(thumbs): rescate miniaturas TT julio 2026 (run ${APIFY_RUN_ID})"
            git push
          fi

      - name: Disparar rebuild del reporte
        uses: actions/github-script@v7
        with:
          script: |
            // Ajusta el nombre del workflow de build si es distinto
            const buildWorkflow = 'build_all_periods.yml';
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: buildWorkflow,
                ref: 'main',
              });
              console.log(`Disparado ${buildWorkflow}`);
            } catch (e) {
              console.log(`No pude disparar ${buildWorkflow} automáticamente: ${e.message}`);
              console.log('Dispáralo tú manualmente desde la pestaña Actions.');
            }
