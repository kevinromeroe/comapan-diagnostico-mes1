name: Render PDF de informes

on:
  workflow_dispatch:
    inputs:
      periods:
        description: "Períodos a renderizar, separados por espacio (ej: 2026-06 2026-07)"
        required: true
        default: "2026-06 2026-07"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Servir el sitio localmente
        run: |
          python -m http.server 8000 &
          sleep 3
          curl -sI http://localhost:8000/ | head -1

      - name: Renderizar PDFs
        run: |
          python scripts/render_pdf.py ${{ github.event.inputs.periods }}

      - name: Commit PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add */reporte.pdf
          if git diff --staged --quiet; then
            echo "Sin cambios en PDFs"
          else
            git commit -m "docs(pdf): render de informes ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main || (git rebase --abort && exit 1)
            git push
          fi
