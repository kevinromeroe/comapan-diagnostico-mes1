name: Render PDF de informes

on:
  workflow_dispatch:
    inputs:
      periods:
        description: "Períodos separados por espacio (vacío = todos: diagnostico + meses)"
        required: false
        default: ""
  # CADENA: se ejecuta al terminar el build (que a su vez viene de la ingesta)
  workflow_run:
    workflows: ["Build diagnóstico extendido HTML (gratis)"]
    types: [completed]

concurrency:
  group: comapan-render-pdf
  cancel-in-progress: false

jobs:
  render:
    # Solo si el build terminó OK (o si se dispara manualmente)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Servir el sitio localmente
        run: |
          python -m http.server 8000 &
          sleep 3
          curl -sI http://localhost:8000/ | head -1

      - name: Renderizar PDFs (vacío = todos los períodos)
        run: |
          python scripts/render_pdf.py ${{ github.event.inputs.periods }}

      - name: Commit PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add */reporte.pdf
          if git diff --staged --quiet; then
            echo "Sin cambios en PDFs"
          else
            git commit -m "docs(pdf): render de informes ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main || (git rebase --abort && exit 1)
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main || true
              sleep 2
            done
          fi
