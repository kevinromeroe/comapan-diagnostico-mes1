name: Build diagnóstico extendido HTML (gratis)

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Periodo a construir (diagnostico | 2026-06 | 2026-07 ...)"
        required: true
        default: "diagnostico"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install deps
        run: pip install -r requirements.txt

      - name: 1) Generar narrativas LLM (Gemini, gratis)
        continue-on-error: true
        run: python scripts/generate_narratives.py --period diagnostico-extendido

      - name: 2) Construir HTML estático con DATA embebida
        run: python scripts/build_diagnostico_extendido_html.py --period "${{ github.event.inputs.period }}"

      - name: 3) Commit & push (con retry si hay diff)
        run: |
          git config user.email "bot@datalitica.com.co"
          git config user.name "Datalitica Bot"
          git add "${{ github.event.inputs.period }}/index.html" diagnostico/index.html index.html || git add diagnostico/index.html index.html || true
          git diff --quiet --cached && echo "Sin cambios — nada que pushear" && exit 0
          git commit -m "Build automático: diagnóstico extendido (Ene-May 2026)"
          # Rebase sobre lo último por si alguien commiteó en paralelo
          git pull --rebase origin main || (git rebase --abort && exit 1)
          # Intentar push, con un retry si falla
          for i in 1 2 3; do
            git push && break
            echo "Push falló intento $i, re-rebase y reintento…"
            git pull --rebase origin main || true
            sleep 2
          done
