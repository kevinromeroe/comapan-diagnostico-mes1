name: Build diagnóstico extendido HTML (gratis)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install deps
        run: pip install -r requirements.txt

      - name: 1) Generar narrativas LLM (Gemini, gratis)
        continue-on-error: true
        run: python scripts/generate_narratives.py --period diagnostico-extendido

      - name: 2) Construir HTML estático con DATA embebida
        run: python scripts/build_diagnostico_extendido_html.py

      - name: 3) Commit & push
        run: |
          git config user.email "bot@datalitica.com.co"
          git config user.name "Datalitica Bot"
          git add diagnostico-extendido/index.html
          git diff --quiet --cached || git commit -m "Build automático: diagnóstico extendido (Ene-May 2026, 298 posts)"
          git push
