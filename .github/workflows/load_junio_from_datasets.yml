name: LOAD-ONLY junio 2026 (datasets ya pagados, $0)

on:
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APIFY_TOKEN:           ${{ secrets.APIFY_TOKEN }}
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Verificar secrets (rapido)
        run: |
          [ -n "$SUPABASE_URL" ] && echo "✓ SUPABASE_URL presente (len=${#SUPABASE_URL})" || (echo "✗ SUPABASE_URL VACIO!" && exit 1)
          [ -n "$SUPABASE_SERVICE_KEY" ] && echo "✓ SUPABASE_SERVICE_KEY presente" || (echo "✗ SUPABASE_SERVICE_KEY VACIO!" && exit 1)

      - name: Load datasets (no scraping, no cost)
        run: python scripts/load_junio_from_datasets.py

      - name: Commit thumbnails al repo
        run: |
          git config user.email "bot@datalitica.com.co"
          git config user.name "Datalitica Bot"
          git add assets/thumbs/ || true
          git diff --quiet --cached && echo "Sin thumbs nuevos" && exit 0
          git commit -m "Load junio 2026: thumbnails locales"
          git pull --rebase origin main || true
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main || true
            sleep 2
          done
