name: Generate Narratives (LLM)

on:
  workflow_dispatch:
    inputs:
      period:
        description: "ID del periodo (ej: 2026-06 o diagnostico)"
        required: true
        default: "2026-06"

jobs:
  narratives:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install deps
        run: pip install pyyaml
      - name: Run narratives generator
        run: python scripts/generate_narratives.py --period "${{ github.event.inputs.period }}"
