name: Rescue thumbnails faltantes (temporal, gratis)

on:
  workflow_dispatch:

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Rescue missing thumbs
        run: python scripts/rescue_missing_thumbs.py

      - name: Commit thumbnails
        run: |
          git config user.email "bot@datalitica.com.co"
          git config user.name "Datalitica Bot"
          git add assets/thumbs/ || true
          git diff --quiet --cached && echo "Sin thumbs nuevos" && exit 0
          git commit -m "Rescue thumbnails faltantes"
          git pull --rebase origin main || true
          git push
